<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수강료 안내 - 예종미술학원</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: '맑은 고딕', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 40px;
      line-height: 1.8;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
    .note {
      font-size: 13px;
      color: #888;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>수강료 안내</h1>
    <table>
      <thead>
        <tr>
          <th>과정</th>
          <th>수강료</th>
          <th>수업 횟수</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>유치부</td>
          <td>월 120,000원</td>
          <td>주 1회</td>
        </tr>
        <tr>
          <td>초등부</td>
          <td>월 150,000원</td>
          <td>주 1~2회</td>
        </tr>
        <tr>
          <td>중고등부</td>
          <td>월 180,000원</td>
          <td>주 2회</td>
        </tr>
        <tr>
          <td>입시반</td>
          <td>상담 후 결정</td>
          <td>개별 맞춤</td>
        </tr>
        <tr>
          <td>도예 / 성인취미반</td>
          <td>월 130,000원</td>
          <td>주 1회</td>
        </tr>
      </tbody>
    </table>
    <p class="note">※ 수강료는 수업 형태와 횟수에 따라 조정될 수 있으며, 자세한 상담은 유선 또는 방문 상담을 통해 안내드립니다.</p>
  </div>
</body>
</html>
